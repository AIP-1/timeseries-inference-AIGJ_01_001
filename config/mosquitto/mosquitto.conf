# 추론 결과 배포용 MQTT 브로커 (보드 안). 강사 브로커에는 발행하지 않는다.
per_listener_settings true
persistence true
persistence_location /mosquitto/data/

# 1883: compose 내부망 전용(포트 공개 안 함). infer 서비스가 여기로 발행한다.
listener 1883
allow_anonymous true

# 1884: 다른 팀 구독용(보드 주소로 공개). 읽기만 된다.
listener 1884
allow_anonymous true
acl_file /mosquitto/config/acl-readonly
