# 수집기 + 로컬 InfluxDB. 보드 재부팅 뒤에도 Docker 가 자동으로 다시 띄운다(restart: unless-stopped).
#
# 강사 InfluxDB(iot-bucket)는 다른 수집기가 이미 쓰는 공용 저장소라 여기에 쓰지 않는다.
# 우리 수집기는 Jetson 안의 InfluxDB 에 쓰고, iot-bucket 은 과거 데이터를 읽는 용도로만 쓴다.
services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${LOCAL_INFLUX_PASSWORD:?.env 에 LOCAL_INFLUX_PASSWORD 필요}
      DOCKER_INFLUXDB_INIT_ORG: aigj
      DOCKER_INFLUXDB_INIT_BUCKET: sensors
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${LOCAL_INFLUX_TOKEN:?.env 에 LOCAL_INFLUX_TOKEN 필요}
    volumes:
      - influxdb:/var/lib/influxdb2
    ports:
      # Jetson 안에서만 접근 (학습·추론 코드용). 8086 은 보드에서 이미 다른 InfluxDB 가 쓰고 있어 18086 을 쓴다.
      - "127.0.0.1:${LOCAL_INFLUX_PORT:-18086}:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  collector:
    build: .
    image: aigj/collector:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # .env 의 INFLUX_* (강사 서버)를 덮어써서 로컬 InfluxDB 에 쓴다
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: aigj
      INFLUX_BUCKET: sensors
      INFLUX_TOKEN: ${LOCAL_INFLUX_TOKEN}
    depends_on:
      - influxdb
    # 호스트 계정 권한으로 실행해 data/ 파일을 sudo 없이 지울 수 있게 한다
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./data:/data
      - ./config:/app/config:ro   # 설정만 바꾸고 재시작하면 반영 (이미지 다시 빌드 불필요)
    ports:
      - "8090:8090"               # 수집 현황: http://<jetson>:8090/status
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 과제 8: 추론 결과 배포용 브로커. 1884 는 다른 팀이 읽기 전용으로 구독(retained 최신값을 바로 받음)
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
      - mqtt:/mosquitto/data
    ports:
      - "1884:1884"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 과제 8: 상시 추론 서비스. 매분 예측·이상·상태 계산 → MQTT(mqtt:1883) 발행 + 조회 API :8091
  infer:
    image: aigj/lab:latest
    restart: unless-stopped
    command: python -m analysis.service
    env_file: .env
    environment:
      # 원자료는 우리 수집기가 쓰는 로컬 InfluxDB
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: aigj
      INFLUX_BUCKET: sensors
      INFLUX_TOKEN: ${LOCAL_INFLUX_TOKEN}
      # 로컬에 일주일치가 쌓이기 전까지 그 앞부분만 강사 iot-bucket 에서 읽기(쓰지 않음)
      INSTRUCTOR_INFLUX_URL: ${INFLUX_URL}
      INSTRUCTOR_INFLUX_TOKEN: ${INFLUX_TOKEN}
      INSTRUCTOR_INFLUX_ORG_ID: ${INFLUX_ORG_ID}
      INSTRUCTOR_INFLUX_BUCKET: ${INFLUX_BUCKET:-iot-bucket}
      PUB_MQTT_HOST: mqtt
      PUB_MQTT_PORT: "1883"
      COLLECTOR_CONFIG: /app/config/collector.yaml
    depends_on:
      - influxdb
      - mqtt
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
      - ./analysis:/app/analysis:ro
    ports:
      - "8091:8091"               # 조회 API: http://<jetson>:8091/spaces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 분석 도구 (상시 실행 아님). 사용: docker compose run --rm lab python -m analysis.task2
  lab:
    build:
      context: .
      dockerfile: Dockerfile.analysis
    image: aigj/lab:latest
    profiles: ["tools"]
    env_file: .env          # INFLUX_* = 강사 InfluxDB (iot-bucket 읽기)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./data:/data
      - ./analysis:/app/analysis:ro   # 코드 수정 시 이미지 다시 빌드 불필요

volumes:
  influxdb:
  mqtt:
